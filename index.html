<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Pengurangan - SD N 71 MALTENG</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #eaf7f2;
  margin: 0;
  padding: 20px;
}

.box {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 5px 15px #999;
}

h1 {
  color: #1976d2;
  font-size: 40px;
  margin: 10px;
}

.school {
  color: #388e3c;
  font-size: 24px;
  font-weight: bold;
}

.teacher {
  font-size: 22px;
  margin: 8px;
}

.info {
  background: #fff1bd;
  padding: 15px;
  border-radius: 18px;
  font-size: 20px;
  margin: 20px 0;
}

.question {
  font-size: 45px;
  font-weight: bold;
  margin: 25px;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.answers button {
  font-size: 28px;
  padding: 18px;
  border: none;
  border-radius: 18px;
  background: #8cc8f0;
  cursor: pointer;
}

.answers button:active {
  transform: scale(0.95);
}

#feedback {
  font-size: 22px;
  font-weight: bold;
  margin: 20px;
}

#progress {
  font-size: 20px;
}

#result {
  font-size: 28px;
  font-weight: bold;
}

.restart {
  background: #4caf50;
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 15px;
  font-size: 22px;
}
</style>
</head>

<body>

<div class="box">

<h1>➖ Game Pengurangan</h1>

<div class="school">
SD N 71 MALTENG
</div>

<div class="teacher">
👩‍🏫 Ma'am Dela
</div>

<div class="info">
Ayo hitung dengan teliti! 🌟<br>
Pengurangan bilangan di bawah 30.<br>
Ada 10 soal.
</div>

<div id="game">

<div id="progress"></div>

<div class="question" id="question"></div>

<div class="answers">
<button onclick="jawab(0)" id="a0"></button>
<button onclick="jawab(1)" id="a1"></button>
<button onclick="jawab(2)" id="a2"></button>
<button onclick="jawab(3)" id="a3"></button>
</div>

<div id="feedback"></div>

</div>

<div id="result"></div>

</div>

<script>

var soal = [
  ["27 − 13 = ...", [12, 14, 15, 16], 1],
  ["24 − 11 = ...", [11, 12, 13, 14], 2],
  ["29 − 15 = ...", [12, 13, 14, 15], 2],
  ["26 − 12 = ...", [12, 13, 14, 15], 2],
  ["23 − 14 = ...", [7, 8, 9, 10], 2],
  ["28 − 16 = ...", [10, 11, 12, 13], 2],
  ["25 − 13 = ...", [10, 11, 12, 13], 2],
  ["21 − 12 = ...", [7, 8, 9, 10], 2],
  ["29 − 17 = ...", [10, 11, 12, 13], 2],
  ["27 − 18 = ...", [7, 8, 9, 10], 2]
];

var nomor = 0;
var nilai = 0;

function tampilkanSoal() {

  document.getElementById("progress").innerHTML =
    "Soal " + (nomor + 1) + " dari 10";

  document.getElementById("question").innerHTML =
    soal[nomor][0];

  document.getElementById("a0").innerHTML =
    soal[nomor][1][0];

  document.getElementById("a1").innerHTML =
    soal[nomor][1][1];

  document.getElementById("a2").innerHTML =
    soal[nomor][1][2];

  document.getElementById("a3").innerHTML =
    soal[nomor][1][3];

  document.getElementById("feedback").innerHTML =
    "Pilih jawabanmu! 👇";
}

function jawab(pilihan) {

  if (pilihan == soal[nomor][2]) {

    nilai = nilai + 10;

    document.getElementById("feedback").innerHTML =
      "🎉 BENAR! Hebat sekali!";

  } else {

    document.getElementById("feedback").innerHTML =
      "😊 Belum tepat. Tetap semangat!";
  }

  setTimeout(function() {

    nomor = nomor + 1;

    if (nomor < soal.length) {

      tampilkanSoal();

    } else {

      document.getElementById("game").style.display = "none";

      document.getElementById("result").innerHTML =
        "<h2>🎊 Permainan Selesai!</h2>" +
        "<p>Skor kamu:</p>" +
        "<p style='font-size:45px;'>" + nilai + " / 100</p>" +
        "<p>❤️ Terima kasih sudah belajar bersama Ma'am Dela!</p>" +
        "<button class='restart' onclick='location.reload()'>🔄 Main Lagi</button>";
    }

  }, 800);
}

tampilkanSoal();

</script>

</body>
</html>
